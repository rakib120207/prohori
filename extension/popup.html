<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><title>Prohori</title>
<style>
  body{margin:0;background:#0b0d12;width:380px}
  #app{padding:12px}
  textarea{width:100%;min-height:110px;resize:vertical;background:#171c27;color:#e8ecf3;border:1px solid #232b3a;border-radius:10px;padding:10px;font:14px/1.6 "Noto Sans Bengali","Nirmala UI","Segoe UI",sans-serif;outline:none;box-sizing:border-box}
  textarea:focus{border-color:#7c9cff}
  .bar{display:flex;gap:8px;margin:8px 0;align-items:center}
  button.b{background:#7c9cff;color:#08101f;border:0;border-radius:9px;padding:8px 14px;font:600 13px sans-serif;cursor:pointer}
  button.g{background:none;color:#8d98ab;border:1px solid #232b3a;font-weight:500}
  .sp{flex:1}
  a{color:#8d98ab;font:12px sans-serif;text-decoration:none}
  #out .ph{box-shadow:none;border:0;padding:0;width:auto;max-height:none;background:transparent}
</style></head>
<body><div id="app">
  <textarea id="t" placeholder="এখানে বাংলা লেখা পেস্ট করুন… (100+ words works best)"></textarea>
  <div class="bar"><button class="b g" id="sel" title="Use the text selected on the page">Use page selection</button><span class="sp"></span><button class="b" id="go">Analyze</button></div>
  <div id="out"></div>
  <div class="bar" style="margin-top:10px"><a href="options.html" id="opt">Settings</a><span class="sp"></span><span style="color:#8d98ab;font:11px sans-serif">Alt+Shift+P checks the selection</span></div>
</div>
<script src="ui.js"></script><script src="popup.js"></script></body></html>
